name: GitHub Metrics

on:
  schedule:
    # 06:23 in America/Sao_Paulo (09:23 UTC).
    - cron: "23 9 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: github-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check configuration
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add METRICS_TOKEN under Settings > Secrets and variables > Actions. See .github/METRICS.md."
            exit 1
          fi

      - name: Generate profile metrics
        # Stable release commit verified on 2026-09-01.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: C-J8
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner
          repositories_forks: no
          config_timezone: America/Sao_Paulo
          config_display: regular
          config_animations: no
          config_order: base.header, base.activity+community, base.repositories, languages, isocalendar
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: yes
          output_action: commit
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore: update profile metrics [skip ci]"
